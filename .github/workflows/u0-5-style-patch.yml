name: U0.5 Generated PHP Style Patch

on:
  push:
    branches: [feature/u0-5-generated-solution-acceptance]
    paths:
      - .github/workflows/u0-5-style-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/u0-5-generated-solution-acceptance

      - name: Apply generated PHP style fixes
        run: python3 scripts/apply-u0-5-style-fixes.py

      - name: Commit style fixes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php
          git commit -m "fix: emit Pint-clean generated PHP"
          git push origin HEAD:feature/u0-5-generated-solution-acceptance
