name: U0.6 Add Persistence Test Dependency

on:
  push:
    branches:
      - feature/u0-6-executable-vertical-slices
    paths:
      - .github/workflows/u0-6-add-persistence-test-dependency.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/u0-6-executable-vertical-slices
          fetch-depth: 0

      - name: Apply dependency fix
        run: python3 scripts/u0-6-add-persistence-test-dependency.py

      - name: Validate exporter
        run: |
          git diff --check
          php -l app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php
          git commit -m "fix: include persistence test dependency when needed"
          git push origin HEAD:feature/u0-6-executable-vertical-slices
