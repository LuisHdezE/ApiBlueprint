name: U0.11 debug generated bootstrap

on:
  push:
    branches:
      - feature/u0-11-users-create
    paths:
      - .github/workflows/u0-11-debug-generated-bootstrap.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Export SaaS and inspect middleware
        run: |
          cp .env.example .env
          php artisan key:generate
          php scripts/export-template.php saas /tmp/saas.zip
          rm -rf /tmp/saas && mkdir -p /tmp/saas
          unzip -q /tmp/saas.zip -d /tmp/saas
          echo '=== manifest governance ==='
          php -r '$m=json_decode(file_get_contents("/tmp/saas/acceptance-saas/.apiblueprint.json"),true); var_export($m["governance"]);'
          echo
          echo '=== bootstrap idempotency ==='
          grep -n -C 3 -E 'Idempotency|idempotency|withMiddleware|alias' /tmp/saas/acceptance-saas/bootstrap/app.php || true
          echo '=== routes users create ==='
          grep -n -C 2 -E 'users.create|idempotency' /tmp/saas/acceptance-saas/routes/api.php || true
