name: U0.11 fix middleware aliases

on:
  push:
    branches:
      - feature/u0-11-users-create
    paths:
      - scripts/u0-11-fix-middleware-aliases.py
      - .github/workflows/u0-11-fix-middleware-aliases.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/u0-11-users-create
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Apply middleware alias fix
        run: python3 scripts/u0-11-fix-middleware-aliases.py
      - name: Validate exporter syntax
        run: php -l app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php
          git commit -m "fix: compose generated middleware aliases once" || exit 0
          git push origin HEAD:feature/u0-11-users-create
