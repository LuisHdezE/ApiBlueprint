name: U0.10 temporary targeted fixes

on:
  push:
    branches:
      - feature/u0-10-users-show
    paths:
      - scripts/u0-10-fix.py
      - .github/workflows/u0-10-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/u0-10-users-show
          fetch-depth: 0
      - name: Apply targeted fixes
        run: python3 scripts/u0-10-fix.py
      - name: Validate syntax
        run: |
          php -l app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php
          php -l app/Application/Blueprint/Queries/GetMasterOpenApi.php
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php app/Application/Blueprint/Queries/GetMasterOpenApi.php
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix(u0.10): correct users.show generation and master OpenAPI"
          git push origin HEAD:feature/u0-10-users-show
