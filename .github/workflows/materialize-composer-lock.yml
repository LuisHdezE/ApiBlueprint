name: Materialize Composer Lock

on:
  push:
    branches: [release/u0-4-continuous-delivery]
    paths:
      - .github/workflows/materialize-composer-lock.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: release/u0-4-continuous-delivery

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Resolve lock file
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Commit lock file
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'build: lock Composer dependencies for U0.4'
          git push origin HEAD:release/u0-4-continuous-delivery
