name: U0.11 apply

on:
  push:
    branches:
      - feature/u0-11-users-create
    paths:
      - scripts/u0-11-apply.py
      - .github/workflows/u0-11-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/u0-11-users-create
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Apply U0.11 patch
        run: python3 scripts/u0-11-apply.py
      - name: Validate PHP syntax
        run: |
          php -l app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php
          php -l app/Application/Blueprint/Queries/GetMasterOpenApi.php
          php -l tests/Feature/GeneratedUsersCreateVerticalSliceExportTest.php
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app config docs tests
          git commit -m "feat: implement canonical users.create" || exit 0
          git push origin HEAD:feature/u0-11-users-create
