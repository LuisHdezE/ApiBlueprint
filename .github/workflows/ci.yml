name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Validate reproducible Composer metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f composer.lock
          composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Code style
        run: vendor/bin/pint --test

      - name: Tests
        run: php artisan test

      - name: Route contract smoke
        run: php artisan route:list --path=api/v1

      - name: Prepare generated solution acceptance tooling
        run: python3 -m pip install --disable-pip-version-check --quiet pyyaml==6.0.2

      - name: Generated solution acceptance
        run: bash scripts/accept-generated-solutions.sh

      - name: Operational Postman contract
        run: bash scripts/run-postman-operational-contract.sh

      - name: Upload operational contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bp-adopt-004-operational-contract
          path: |
            storage/app/qa/newman-report.json
            storage/app/qa/audit-runtime-report.json
          if-no-files-found: warn
          retention-days: 14
