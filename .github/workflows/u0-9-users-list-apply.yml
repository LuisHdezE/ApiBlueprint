name: U0.9 Users List Apply

on:
  push:
    branches:
      - feature/u0-9-users-list
    paths:
      - scripts/u0-9-users-list-apply.py
      - .github/workflows/u0-9-users-list-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/u0-9-users-list
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Apply exporter refactor
        run: python3 scripts/u0-9-users-list-apply.py
      - name: Validate exporter syntax
        run: php -l app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php
      - name: Commit exporter changes
        run: |
          if git diff --quiet; then
            echo "No exporter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php
          git commit -m "feat: add canonical users list vertical slice"
          git push origin HEAD:feature/u0-9-users-list
