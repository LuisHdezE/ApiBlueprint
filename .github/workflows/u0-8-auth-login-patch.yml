name: U0.8 auth login patch

on:
  push:
    branches:
      - feature/u0-8-auth-login
    paths:
      - .github/workflows/u0-8-auth-login-patch.yml
      - .github/scripts/u0-8-auth-login-patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/u0-8-auth-login
          fetch-depth: 0
      - name: Apply governed patch
        run: python3 .github/scripts/u0-8-auth-login-patch.py
      - name: Validate PHP syntax
        run: |
          php -l config/blueprint.php
          php -l app/Application/Blueprint/Services/ResolveBlueprintManifest.php
          php -l app/Application/Blueprint/Queries/GetMasterOpenApi.php
          php -l app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php
          php -l tests/Feature/MasterCatalogTest.php
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/blueprint.php \
            app/Application/Blueprint/Services/ResolveBlueprintManifest.php \
            app/Application/Blueprint/Queries/GetMasterOpenApi.php \
            app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php \
            tests/Feature/MasterCatalogTest.php
          git diff --cached --check
          git commit -m "feat: implement canonical auth login feature"
          git push origin HEAD:feature/u0-8-auth-login
