name: U0.8 Auth Logout Apply

on:
  push:
    branches:
      - feature/u0-8-auth-logout

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/u0-8-auth-logout
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Apply governed patch
        run: python3 scripts/u0-8-auth-logout-apply.py
      - name: Validate changed PHP syntax
        run: |
          php -l config/blueprint.php
          php -l app/Application/Blueprint/Queries/GetMasterOpenApi.php
          php -l app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php
          php -l tests/Feature/MasterCatalogTest.php
          php -l tests/Feature/GeneratedAuthLogoutVerticalSliceExportTest.php
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            echo "No patch changes pending."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app config docs tests
          git commit -m "feat: implement canonical auth logout feature"
          git push origin HEAD:feature/u0-8-auth-logout
