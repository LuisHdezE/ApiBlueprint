name: U0.6 Products List Format Fix

on:
  push:
    branches:
      - feature/u0-6-products-list-vertical-slice
    paths:
      - .github/workflows/u0-6-products-list-format.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/u0-6-products-list-vertical-slice
          fetch-depth: 0

      - name: Apply formatting fix
        run: python3 scripts/u0-6-products-list-format.py

      - name: Validate exporter
        run: |
          git diff --check
          php -l app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Infrastructure/Blueprint/LaravelZipBlueprintExporter.php
          git commit -m "fix: normalize generated product list test spacing"
          git push origin HEAD:feature/u0-6-products-list-vertical-slice
